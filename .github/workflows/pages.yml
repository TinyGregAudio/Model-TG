name: flasher

# Publishes the web flasher (flasher/) on GitHub Pages. Before it does, it
# proves that the code in flasher/model-tg.json is exactly what src/ assembles
# to, and that the file was made from committed source - with no stock
# firmware, which never enters CI. The patch file is made locally from a
# tagged release (docs/FLASHER.md).
on:
  push:
    branches: [main]
    paths: ["flasher/**", "src/**", "build.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ColdFire binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-m68k-linux-gnu
      - name: The published code is this source
        run: python3 build.py --assemble-only --check-flasher flasher/model-tg.json
      - name: The flasher's scripts parse
        run: for f in flasher/*.js tools/test_flasher.js; do node --check "$f"; done
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flasher
      - id: deployment
        uses: actions/deploy-pages@v4
